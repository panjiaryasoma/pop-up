<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Interactive Final Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:system-ui,sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:24px 24px 90px}.panel{position:relative;width:min(900px,92vw);aspect-ratio:16/10;background:#f3efe5;color:#151515;border:10px solid #fff;box-shadow:0 24px 70px #0008;display:none;overflow:hidden}.panel.active{display:block}.panel .label{position:absolute;left:28px;top:24px;font-size:13px;font-weight:900;letter-spacing:.16em}.panel .scene{position:absolute;inset:15% 8% 10%;display:grid;place-items:center;border:4px solid #151515;font-size:clamp(30px,7vw,90px);font-weight:900}.screen{position:absolute;left:40%;top:42%;width:20%;height:19%;border:4px solid #151515;background:#202020;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;cursor:pointer}.screen:hover{outline:5px solid #f3d64e}.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:linear-gradient(transparent,#000c)}button{border:1px solid #666;background:#111;color:#fff;border-radius:999px;padding:11px 20px;font-weight:800;cursor:pointer}button.next{background:#f3d64e;color:#111;border-color:#f3d64e}button:disabled{visibility:hidden}.popup{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:20;padding:30px}.popup.open{display:grid}.card{width:min(600px,90vw);aspect-ratio:16/10;background:#f3d64e;color:#111;display:grid;place-items:center;font-size:clamp(24px,5vw,56px);font-weight:1000;border-radius:18px;box-shadow:0 20px 80px #000}.hint{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#000b;border:1px solid #444;padding:8px 12px;border-radius:999px;font-size:12px;color:#ddd;z-index:5}
</style>
</head>
<body>
<div class="hint">Demo: lanjut sampai Fig 3, lalu klik layar hitam.</div>
<div class="stage">
  <section class="panel active"><div class="label">FIG 1</div><div class="scene">PANEL 1</div></section>
  <section class="panel"><div class="label">FIG 2</div><div class="scene">PANEL 2</div></section>
  <section class="panel"><div class="label">FIG 3 · FINAL</div><div class="scene">FINAL PANEL</div><button class="screen" id="screen">CLICK</button></section>
</div>
<nav class="nav"><button id="prev">← Kembali</button><span id="count">1 / 3</span><button id="next" class="next">Lanjut →</button></nav>
<div class="popup" id="popup"><div class="card">POPUP / GIF / PNG</div></div>
<script>
const panels=[...document.querySelectorAll('.panel')],prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),popup=document.getElementById('popup');let i=0;
function render(){panels.forEach((p,n)=>p.classList.toggle('active',n===i));prev.disabled=i===0;next.disabled=i===panels.length-1;count.textContent=(i+1)+' / '+panels.length}
prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i<panels.length-1){i++;render()}};document.getElementById('screen').onclick=()=>popup.classList.add('open');popup.onclick=()=>popup.classList.remove('open');render();
</script>
</body>
</html>
