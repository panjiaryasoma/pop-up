<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COBA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="gambar-panjang">
    <img src="gambar-1.JPG" alt="Gambar 1" />
    <img src="gambar-2.JPG" alt="Gambar 2" />
    <img src="gambar-3.JPG" alt="Gambar 3" />

    <!--
      Panel paling akhir tetap jadi bagian dari halaman panjang,
      tapi dibungkus supaya kita bisa menaruh area interaktif relatif ke Gambar 4.
    -->
    <div class="panel-terakhir">
      <img src="gambar-4.JPG" alt="Gambar 4" />

      <!--
        AREA INTERAKTIF FINAL.

        data-mode="overlay"  -> cuma area ini yang berubah.
        data-mode="popup"    -> media muncul sebagai popup besar.

        Ganti data-media dengan PNG/GIF/WebP yang mau dipakai.
      -->
      <button
        type="button"
        class="area-final"
        id="areaFinal"
        data-mode="overlay"
        data-media="final-area.gif"
        aria-label="Area interaktif panel terakhir"
      ></button>

      <!-- Dipakai hanya saat data-mode="overlay" -->
      <img
        id="mediaFinalArea"
        class="media-final-area"
        src=""
        alt="Konten interaktif panel terakhir"
      />
    </div>

    <!-- Tombol popup lama dari template Stephen tetap dipertahankan -->
    <button class="tombol-popup tombol-1" data-popup="popup-1.JPG">👆</button>
    <button class="tombol-popup tombol-2" data-popup="popup-2.JPG">👆</button>
    <button class="tombol-popup tombol-3" data-popup="popup-3.JPG">👆</button>
    <button class="tombol-popup tombol-4" data-popup="popup-4.JPG">👆</button>
    <button class="tombol-popup tombol-5" data-popup="popup-5.JPG">👆</button>
    <button class="tombol-popup tombol-6" data-popup="popup-6.JPG">👆</button>
    <button class="tombol-popup tombol-7" data-popup="popup-7.png">👆</button>
  </div>

  <div class="pertanyaan">
    <label for="jawaban">Apa kata yang anda temukan? (Kapital semua)</label>
    <input type="text" id="jawaban" placeholder="Ketik jawaban di sini" autocomplete="off" />
    <button type="button" id="cekJawaban">Jawab</button>
    <p id="pesanJawaban"></p>
  </div>

  <!-- Popup biasa, dipakai tombol lama dan bisa dipakai area final -->
  <div class="popup" id="popup">
    <img id="gambarPopup" src="" alt="Gambar pop-up" />
  </div>

  <div class="popup" id="popupJawaban">
    <img src="popup-jawaban-benar.png" alt="Jawaban benar" />
  </div>

  <script src="script.js"></script>
</body>
</html>
